name: Release

# Publishing a GitHub Release tagged vX.Y.Z publishes @xedinunknown/agents-config
# X.Y.Z to the public npm registry and attaches the package tarball to the
# release.
#
# Authentication: npm trusted publishing (OIDC). The package's settings on
# npmjs.com name this workflow as its trusted publisher; no token is stored.
on:
  release:
    types: [published]

permissions:
  contents: write # attach the tarball to the release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install --global npm@11

      - name: Check the tag and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not vX.Y.Z"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: make setup
      - run: make check

      - name: Set the package version from the tag
        run: npm version --no-git-tag-version "$VERSION"

      - run: make pack

      - name: Publish to npm
        run: npm publish ./xedinunknown-agents-config-"$VERSION".tgz --access public ${{ github.event.release.prerelease && '--tag next' || '' }}

      - name: Attach the tarball to the release
        run: gh release upload "$GITHUB_REF_NAME" ./xedinunknown-agents-config-"$VERSION".tgz
        env:
          GH_TOKEN: ${{ github.token }}
